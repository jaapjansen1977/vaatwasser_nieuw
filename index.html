<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vaatwasser VR</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#17222b; color:#fff; }
    #panel {
      position:fixed; z-index:9999; top:16px; left:16px; width:410px;
      padding:14px; border-radius:10px; background:rgba(8,14,18,.88);
    }
    #panel button { margin-top:8px; padding:9px 13px; border:0; border-radius:8px; }
    #version { opacity:.65; font-size:12px; }
  </style>
</head>
<body>

<div id="panel">
  <div><strong>Vaatwasser VR</strong> <span id="version">dev v10</span></div>
  <div id="status">Start VR. Daarna: schouder kalibreren.</div>
  <div id="detail">Nog geen schouderpunt opgeslagen.</div>
  <button id="saveButton" disabled>CSV opslaan</button>
</div>

<a-scene id="scene" dishwasher-runtime background="color:#dfe7eb">
  <a-entity light="type:ambient; intensity:0.95; color:#ffffff"></a-entity>
  <a-entity light="type:directional; intensity:0.55; color:#ffffff" position="-2 5 2"></a-entity>

  <a-plane position="0 1.6 -3.4" width="7" height="3.8" color="#e8e2d9"></a-plane>
  <a-plane position="0 0 -2.5" rotation="-90 0 0" width="7" height="7" color="#b9b5ad"></a-plane>

  <!-- vaatwasser -->
  <a-box id="dishwasherBody" position="0 0.48 -1.55" width="1.25" height="0.9" depth="0.65" color="#6f7b82"></a-box>
  <a-box id="dishwasherDoor" position="0 0.18 -1.05" rotation="-65 0 0" width="1.25" height="0.06" depth="0.9" color="#aab3b8"></a-box>

  <a-entity id="waitingPlate" position="0 0.58 -1.12">
    <a-cylinder radius="0.18" height="0.03" rotation="90 0 0" color="#fffaf0"></a-cylinder>
    <a-torus radius="0.18" radius-tubular="0.012" rotation="90 0 0" color="#d8c47b"></a-torus>
  </a-entity>

  <!-- plank: hoogte wordt na schouderkalibratie aangepast -->
  <a-box id="shelf" position="0 1.55 -1.50" width="2.2" height="0.08" depth="0.45" color="#9b7657"></a-box>
  <a-entity id="placedPlates" position="0 1.61 -1.30"></a-entity>
  <a-entity id="placementTarget" position="0 1.65 -1.30"></a-entity>

  <!-- controller -->
  <a-entity id="rightController" laser-controls="hand:right"></a-entity>

  <!-- virtuele arm wordt in v3 rechtstreeks als THREE.js-mesh toegevoegd.
       Dit omzeilt mogelijke A-Frame visibility/primitive-problemen in Quest WebXR. -->

  <!-- gedragen bord -->
  <a-entity id="carriedPlate" visible="false">
    <a-cylinder radius="0.19" height="0.035" rotation="90 0 0" color="#fff6d5"></a-cylinder>
    <a-torus radius="0.19" radius-tubular="0.012" rotation="90 0 0" color="#d6b85f"></a-torus>
  </a-entity>

  <a-camera id="camera" position="0 1.6 0">
    <a-entity position="0 -0.18 -1.35">
      <a-plane width="1.40" height="0.44" color="#10212a" opacity="0.80"></a-plane>
      <a-text id="hud" value="Start VR" align="center" width="1.20" position="0 0 0.01" color="#ffffff"></a-text>
    </a-entity>
  </a-camera>
</a-scene>

<script>
AFRAME.registerComponent('dishwasher-runtime', {
  tick: function () {
    if (window.updateDishwasherFrame) {
      window.updateDishwasherFrame();
    }
  }
});

(function () {
  const scene = document.querySelector('#scene');
  const rightController = document.querySelector('#rightController');

  const status = document.querySelector('#status');
  const detail = document.querySelector('#detail');
  const hud = document.querySelector('#hud');
  const saveButton = document.querySelector('#saveButton');

  const dishwasherBody = document.querySelector('#dishwasherBody');
  const dishwasherDoor = document.querySelector('#dishwasherDoor');
  const waitingPlate = document.querySelector('#waitingPlate');
  const carriedPlate = document.querySelector('#carriedPlate');
  const shelf = document.querySelector('#shelf');
  const placedPlates = document.querySelector('#placedPlates');
  const placementTarget = document.querySelector('#placementTarget');

  let shoulderMesh = null;
  let upperArmMesh = null;
  let elbowMesh = null;
  let foreArmMesh = null;
  let palmMesh = null;
  let thumbMesh = null;

  const cfg = {
    duration: 120,
    gainSchedule: [
      { until: 20, gain: 1.00 },
      { until: 40, gain: 0.95 },
      { until: 60, gain: 0.90 },
      { until: 80, gain: 0.85 },
      { until: 100, gain: 0.80 },
      { until: 120, gain: 0.75 }
    ],
    shelfOffsetFromShoulderY: -0.05,

    // Afstand van de taakobjecten voor de gebruiker.
    // Minder negatief = dichterbij. -0.85 is ~27 cm dichterbij dan voorheen.
    taskZ: -0.85,

    pickupRadius: 0.20,

    // Plaatsen gebeurt niet meer rond één klein punt, maar boven de hele plank.
    shelfHalfWidth: 1.15,
    shelfYBelow: 0.12,
    shelfYAbove: 0.30,
    shelfZHalfDepth: 0.38,

    // Anatomische arm v10. Eerste testwaarden in meter.
    upperArmLength: 0.31,
    foreArmLength: 0.27,
    handLength: 0.16,
    elbowPreference: { x: 0.35, y: -0.85, z: 0.15 }
  };

  let phase = 'CALIBRATE_SHOULDER';
  let shoulder = null;
  let startHand = null;
  let startTime = 0;
  let carrying = false;
  let waitingRespawn = false;
  let placedCount = 0;
  let plateNumber = 1;
  let lastFrameLog = 0;
  let autoSaved = false;

  const data = [];
  const controllerWorld = new THREE.Vector3();
  const pickupWorld = new THREE.Vector3();
  const placeWorld = new THREE.Vector3();
  const shelfWorld = new THREE.Vector3();

  function inShelfPlacementZone(controller) {
    scene.object3D.updateMatrixWorld(true);
    shelf.object3D.getWorldPosition(shelfWorld);

    const dx = controller.x - shelfWorld.x;
    const dy = controller.y - shelfWorld.y;
    const dz = controller.z - shelfWorld.z;

    const inside =
      Math.abs(dx) <= cfg.shelfHalfWidth &&
      dy >= -cfg.shelfYBelow &&
      dy <= cfg.shelfYAbove &&
      Math.abs(dz) <= cfg.shelfZHalfDepth;

    return { inside, dx, dy, dz };
  }

  function distanceToEntity(controller, entity, tempVector) {
    scene.object3D.updateMatrixWorld(true);
    entity.object3D.getWorldPosition(tempVector);
    const dx = controller.x - tempVector.x;
    const dy = controller.y - tempVector.y;
    const dz = controller.z - tempVector.z;
    return Math.sqrt(dx*dx + dy*dy + dz*dz);
  }

  function setHud(text) {
    hud.setAttribute('value', text);
    status.textContent = text.replace(/\n/g, ' ');
  }

  function getController() {
    if (!scene.is('vr-mode')) return null;
    if (!rightController || !rightController.object3D) return null;
    rightController.object3D.getWorldPosition(controllerWorld);

    if (!Number.isFinite(controllerWorld.x) ||
        !Number.isFinite(controllerWorld.y) ||
        !Number.isFinite(controllerWorld.z)) {
      return null;
    }

    return {
      x: controllerWorld.x,
      y: controllerWorld.y,
      z: controllerWorld.z
    };
  }

  function getGain(t) {
    for (const s of cfg.gainSchedule) {
      if (t < s.until) return s.gain;
    }
    return cfg.gainSchedule[cfg.gainSchedule.length - 1].gain;
  }

  function makeAlwaysVisibleMaterial(color) {
    return new THREE.MeshBasicMaterial({
      color,
      depthTest: false,
      depthWrite: false
    });
  }

  function initVirtualArmMeshes() {
    if (shoulderMesh) return;

    shoulderMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 18, 14),
      makeAlwaysVisibleMaterial(0xb87956)
    );
    shoulderMesh.renderOrder = 999;
    shoulderMesh.visible = false;
    scene.object3D.add(shoulderMesh);

    upperArmMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.055, 0.065, 1.0, 18),
      makeAlwaysVisibleMaterial(0xd79a73)
    );
    upperArmMesh.renderOrder = 999;
    upperArmMesh.visible = false;
    scene.object3D.add(upperArmMesh);

    elbowMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.052, 18, 14),
      makeAlwaysVisibleMaterial(0xc98a64)
    );
    elbowMesh.renderOrder = 999;
    elbowMesh.visible = false;
    scene.object3D.add(elbowMesh);

    foreArmMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.045, 0.055, 1.0, 18),
      makeAlwaysVisibleMaterial(0xdea47b)
    );
    foreArmMesh.renderOrder = 999;
    foreArmMesh.visible = false;
    scene.object3D.add(foreArmMesh);

    // Afgeplatte palm in plaats van een bol.
    palmMesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.095, 0.035, cfg.handLength),
      makeAlwaysVisibleMaterial(0xe2aa82)
    );
    palmMesh.renderOrder = 999;
    palmMesh.visible = false;
    scene.object3D.add(palmMesh);

    // Eenvoudige duim, zodat de hand herkenbaar is als rechterhand.
    thumbMesh = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.018, 0.055, 5, 10),
      makeAlwaysVisibleMaterial(0xe2aa82)
    );
    thumbMesh.renderOrder = 999;
    thumbMesh.visible = false;
    scene.object3D.add(thumbMesh);
  }

  function setSegmentBetween(mesh, a, b) {
    const dir = new THREE.Vector3().subVectors(b, a);
    const len = dir.length();
    if (len < 0.005) {
      mesh.visible = false;
      return;
    }

    const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
    mesh.position.copy(mid);
    mesh.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      dir.clone().normalize()
    );
    mesh.scale.set(1, len, 1);
    mesh.visible = true;
  }

  function solveElbow(shoulderPos, handPos) {
    const L1 = cfg.upperArmLength;
    const L2 = cfg.foreArmLength;

    const toHand = new THREE.Vector3().subVectors(handPos, shoulderPos);
    let d = toHand.length();

    if (d < 0.02) {
      return shoulderPos.clone().add(new THREE.Vector3(0.05, -L1, 0));
    }

    const dir = toHand.clone().normalize();

    // Houd de wiskunde binnen het bereik van een 2-link arm.
    const minD = Math.abs(L1 - L2) + 0.005;
    const maxD = L1 + L2 - 0.005;
    d = THREE.MathUtils.clamp(d, minD, maxD);

    const along =
      (L1 * L1 - L2 * L2 + d * d) /
      (2 * d);

    const perpendicular = Math.sqrt(
      Math.max(0, L1 * L1 - along * along)
    );

    // Voorkeursrichting voor de rechterelleboog:
    // vooral naar beneden, iets naar buiten en iets naar voren.
    let pole = new THREE.Vector3(
      cfg.elbowPreference.x,
      cfg.elbowPreference.y,
      cfg.elbowPreference.z
    );

    // Maak pole loodrecht op schouder-hand-richting.
    pole.sub(dir.clone().multiplyScalar(pole.dot(dir)));

    if (pole.lengthSq() < 0.0001) {
      pole = new THREE.Vector3(1, -1, 0);
      pole.sub(dir.clone().multiplyScalar(pole.dot(dir)));
    }

    pole.normalize();

    return shoulderPos.clone()
      .add(dir.clone().multiplyScalar(along))
      .add(pole.multiplyScalar(perpendicular));
  }

  function updateVirtualArm(hand) {
    if (!shoulder || !hand) return;
    initVirtualArmMeshes();

    const s = new THREE.Vector3(shoulder.x, shoulder.y, shoulder.z);
    const h = new THREE.Vector3(hand.x, hand.y, hand.z);

    // De virtuele hand mag verder liggen dan de gekozen armlengte.
    // Voor de armgeometrie projecteren we hem zo nodig terug naar maximaal bereik,
    // maar de taak/controllerlogica blijft ongewijzigd.
    const sh = new THREE.Vector3().subVectors(h, s);
    const maxReach = cfg.upperArmLength + cfg.foreArmLength - 0.005;
    const wrist = sh.length() > maxReach
      ? s.clone().add(sh.clone().normalize().multiplyScalar(maxReach))
      : h.clone();

    const elbow = solveElbow(s, wrist);

    shoulderMesh.position.copy(s);
    elbowMesh.position.copy(elbow);

    shoulderMesh.visible = true;
    elbowMesh.visible = true;

    setSegmentBetween(upperArmMesh, s, elbow);
    setSegmentBetween(foreArmMesh, elbow, wrist);

    // Oriënteer de palm in de richting van de onderarm.
    const foreDir = new THREE.Vector3().subVectors(wrist, elbow).normalize();
    palmMesh.position.copy(wrist).add(
      foreDir.clone().multiplyScalar(cfg.handLength * 0.35)
    );

    palmMesh.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 0, -1),
      foreDir.clone()
    );
    palmMesh.visible = true;

    // Duim aan de rechterzijde van de palm.
    const side = new THREE.Vector3(1, 0, 0)
      .applyQuaternion(palmMesh.quaternion);

    thumbMesh.position.copy(palmMesh.position)
      .add(side.clone().multiplyScalar(0.065))
      .add(foreDir.clone().multiplyScalar(-0.015));

    thumbMesh.quaternion.copy(palmMesh.quaternion);
    thumbMesh.rotateZ(-0.75);
    thumbMesh.visible = true;
  }

  function log(event, controller, visualY, gain) {
    data.push({
      event,
      time: phase === 'RUNNING' ? (performance.now() - startTime)/1000 : 0,
      gain,
      plate_number: plateNumber,
      carrying,
      shoulder_x: shoulder ? shoulder.x : '',
      shoulder_y: shoulder ? shoulder.y : '',
      shoulder_z: shoulder ? shoulder.z : '',
      controller_x: controller ? controller.x : '',
      controller_y: controller ? controller.y : '',
      controller_z: controller ? controller.z : '',
      visual_y: visualY,
      arm_model: '2-link-IK'
    });
  }

  function buildCSV() {
    if (!data.length) return '';
    const headers = Object.keys(data[0]);
    const lines = [headers.join(',')];
    for (const row of data) {
      lines.push(headers.map(h => row[h] ?? '').join(','));
    }
    return lines.join('\n');
  }

  function saveCSV() {
    const csv = buildCSV();
    if (!csv) return;

    // Bewaar ook een lokale browser-backup. Dit blijft beschikbaar als
    // de automatische download door de Quest-browser wordt geblokkeerd.
    try {
      localStorage.setItem('vaatwasser_last_csv', csv);
      localStorage.setItem('vaatwasser_last_saved_at', new Date().toISOString());
    } catch (e) {
      console.warn('Lokale backup kon niet worden opgeslagen', e);
    }

    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vaatwasser_vr_' + new Date().toISOString().replace(/[:.]/g,'-') + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  function calibrateShoulder(c) {
    shoulder = {...c};

    const shelfY = shoulder.y + cfg.shelfOffsetFromShoulderY;

    // Zet de hele taak dichter bij de gebruiker.
    // taskZ is de positie van het bord; overige objecten houden hun relatieve diepte.
    const plateZ = cfg.taskZ;
    const doorZ = plateZ + 0.07;
    const bodyZ = plateZ - 0.43;
    const shelfZ = plateZ - 0.38;
    const placedZ = plateZ - 0.18;

    dishwasherBody.setAttribute('position', '0 0.48 ' + bodyZ.toFixed(3));
    dishwasherDoor.setAttribute('position', '0 0.18 ' + doorZ.toFixed(3));
    waitingPlate.setAttribute('position', '0 0.58 ' + plateZ.toFixed(3));

    shelf.setAttribute('position', '0 ' + shelfY.toFixed(3) + ' ' + shelfZ.toFixed(3));
    placedPlates.setAttribute('position', '0 ' + (shelfY + 0.06).toFixed(3) + ' ' + placedZ.toFixed(3));
    placementTarget.setAttribute('position', '0 ' + (shelfY + 0.10).toFixed(3) + ' ' + placedZ.toFixed(3));

    phase = 'WAIT_START';
    initVirtualArmMeshes();
    shoulderMesh.position.set(shoulder.x, shoulder.y, shoulder.z);
    shoulderMesh.visible = true;
    log('shoulder_calibration', c, '', 1);

    detail.textContent =
      'Schouder y=' + shoulder.y.toFixed(3) +
      ' | plank y=' + shelfY.toFixed(3);

    setHud(
      'Schouder opgeslagen.\n' +
      'Breng de hand naar een comfortabele startpositie\n' +
      'en druk opnieuw op trigger.'
    );
  }

  function start(c) {
    startHand = {...c};
    startTime = performance.now();
    lastFrameLog = startTime;
    autoSaved = false;
    phase = 'RUNNING';
    carrying = false;
    waitingRespawn = false;
    placedCount = 0;
    plateNumber = 1;

    waitingPlate.setAttribute('visible', true);
    carriedPlate.setAttribute('visible', false);

    log('start', c, c.y, 1);

    setHud(
      'Test gestart.\n' +
      'Raak het bord echt aan en druk trigger.\n' +
      'Raak daarna de plank aan en druk opnieuw.'
    );
  }

  function pickup(c, visualY, gain) {
    carrying = true;
    waitingPlate.setAttribute('visible', false);

    carriedPlate.object3D.position.set(c.x, visualY - 0.02, c.z - 0.14);
    carriedPlate.setAttribute('visible', true);

    log('pickup', c, visualY, gain);
    setHud('Bord gepakt.\nBreng het naar de plank en trigger opnieuw.');
  }

  function place(c, visualY, gain) {
    carrying = false;
    carriedPlate.setAttribute('visible', false);

    const p = document.createElement('a-cylinder');
    p.setAttribute('radius', 0.16);
    p.setAttribute('height', 0.025);
    p.setAttribute('rotation', '90 0 0');
    p.setAttribute('color', '#fffaf0');
    p.setAttribute('position', ((placedCount % 6 - 2.5) * 0.12) + ' 0.02 0');
    placedPlates.appendChild(p);

    placedCount++;
    log('place', c, visualY, gain);

    plateNumber++;
    waitingRespawn = true;
    setHud('Bord geplaatst.\nNieuw bord verschijnt...');

    setTimeout(() => {
      waitingPlate.setAttribute('visible', true);
      waitingRespawn = false;
      setHud('Raak het nieuwe bord aan en druk trigger.');
    }, 450);
  }

  rightController.addEventListener('controllerconnected', function () {
    // Houd tracking en trigger-events actief, maar verberg de fysieke
    // controller/laser zodat alleen de gemanipuleerde virtuele hand zichtbaar is.
    rightController.setAttribute('visible', false);
  });

  rightController.addEventListener('triggerdown', function () {
    const c = getController();
    if (!c) return;

    if (phase === 'CALIBRATE_SHOULDER') {
      calibrateShoulder(c);
      return;
    }

    if (phase === 'WAIT_START') {
      start(c);
      return;
    }

    if (phase === 'RUNNING') {
      const elapsed = (performance.now() - startTime) / 1000;
      const gain = getGain(elapsed);
      const visualY = startHand.y + gain * (c.y - startHand.y);

      if (!carrying && !waitingRespawn) {
        const dPickup = distanceToEntity(c, waitingPlate, pickupWorld);

        if (dPickup <= cfg.pickupRadius) {
          pickup(c, visualY, gain);
        } else {
          setHud(
            'Te ver van het bord.\n' +
            'Afstand ' + Math.round(dPickup * 100) + ' cm.\n' +
            'Raak het bord aan en druk opnieuw.'
          );
        }
      } else if (carrying) {
        const zone = inShelfPlacementZone(c);

        if (zone.inside) {
          place(c, visualY, gain);
        } else {
          setHud(
            'Nog niet boven de plank.\n' +
            'dX ' + Math.round(zone.dx * 100) + ' cm  ' +
            'dY ' + Math.round(zone.dy * 100) + ' cm  ' +
            'dZ ' + Math.round(zone.dz * 100) + ' cm\n' +
            'Breng je hand boven de plank en druk opnieuw.'
          );
        }
      }
    }
  });

  scene.addEventListener('loaded', () => {
    initVirtualArmMeshes();
  });

  scene.addEventListener('enter-vr', () => {
    setHud(
      'Kalibratie:\n' +
      'houd de rechter controller tegen je rechterschouder\n' +
      'en druk op trigger.'
    );
  });

  saveButton.addEventListener('click', saveCSV);

  window.updateDishwasherFrame = function () {
    const c = getController();
    if (!c || !shoulder) return;

    let visualHand = {x:c.x, y:c.y, z:c.z};
    let gain = 1.00;
    let elapsed = 0;

    if (phase === 'RUNNING') {
      const now = performance.now();
      elapsed = (now - startTime) / 1000;

      if (elapsed >= cfg.duration) {
        phase = 'FINISHED';
        saveButton.disabled = false;

        if (!autoSaved) {
          autoSaved = true;
          saveCSV();
        }

        setHud(
          'Klaar. CSV is automatisch opgeslagen/gedownload.\n' +
          'Zo niet: verlaat VR en gebruik de knop CSV opslaan.'
        );
        return;
      }

      gain = getGain(elapsed);

      // Gain geldt uitsluitend voor de verticale UITSLAG t.o.v. de
      // opgeslagen startpositie.
      visualHand.y = startHand.y + gain * (c.y - startHand.y);

      if (carrying) {
        carriedPlate.object3D.position.set(
          c.x,
          visualHand.y - 0.02,
          c.z - 0.14
        );
      }

      const realDelta = c.y - startHand.y;
      const visualDelta = visualHand.y - startHand.y;

      detail.textContent =
        'v10 | t=' + elapsed.toFixed(1) +
        ' | gain=' + gain.toFixed(2) +
        ' | real ΔY=' + realDelta.toFixed(3) +
        ' | vis ΔY=' + visualDelta.toFixed(3);

      if (now - lastFrameLog >= 50) {
        log('frame', c, visualHand.y, gain);
        lastFrameLog = now;
      }
    }

    updateVirtualArm(visualHand);

    // Ook in de VR-HUD tonen we de gain en de twee verticale uitslagen.
    if (phase === 'RUNNING') {
      const realDelta = c.y - startHand.y;
      const visualDelta = visualHand.y - startHand.y;
      setHud(
        'v10  Gain ' + gain.toFixed(2) + '\n' +
        'Real dY ' + realDelta.toFixed(2) + ' m   Visual dY ' + visualDelta.toFixed(2) + ' m\n' +
        (carrying ? 'Trigger = bord loslaten' : 'Trigger = bord pakken')
      );
    }
  };

})();
</script>

</body>
</html>
